# Server port (optional, default is 8080)
server.port=8080  

# H2 in-memory database setup
# spring.datasource.url=jdbc:h2:mem:expensetrackerdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

spring.data.mongodb.uri=mongodb://localhost:27017/expensetracker
spring.data.mongodb.database=expensetracker

# JPA config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# spring.security.user.name=admin
# spring.security.user.password=admin
# spring.security.user.roles=USER
# spring.security.enabled=false

spring.kafka.bootstrap-servers=localhost:9092

# Consumer Group
spring.kafka.consumer.group-id=expense-group
spring.kafka.consumer.auto-offset-reset=earliest

# Producer Serializers (JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Deserializers (JSON)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
 

